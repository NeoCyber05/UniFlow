<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="UniFlow">
  <defs>
    <linearGradient id="uf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#uf-bg)"/>
  <!-- Loop arrow = automation: tasks keep flowing in -->
  <path d="M87.1 36.4A36 36 0 1 1 57.8 28.6" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M71 26.3 56.2 18.6 59.6 38z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <!-- Check = to-do done -->
  <path d="M47 65l11.5 11.5L82 53" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
